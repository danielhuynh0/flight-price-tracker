apiVersion: v1
kind: ConfigMap
metadata:
  name: flight-tracker-config
  namespace: flight-tracker
data:
  AWS_REGION: "us-east-1"
  POLL_INTERVAL_SECONDS: "300"
  FLIGHT_CACHE_TTL_SECONDS: "270"
  NOTIFICATION_COOLDOWN_HOURS: "24"
  DYNAMO_MONITORING_TABLE: "monitoring_requests"
  DYNAMO_PRICE_HISTORY_TABLE: "price_history"
  DYNAMO_NOTIFICATION_TABLE: "notification_history"
  FLASK_PORT: "5000"
  SMTP_HOST: "smtp.gmail.com"
  SMTP_PORT: "465"
  # *** UPDATE THESE with your actual SQS queue URLs ***
  PRICE_EVENTS_QUEUE_URL: "https://sqs.us-east-1.amazonaws.com/YOUR_ACCOUNT_ID/price-events"
  NOTIFICATION_QUEUE_URL: "https://sqs.us-east-1.amazonaws.com/YOUR_ACCOUNT_ID/notifications"
