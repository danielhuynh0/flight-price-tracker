<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Routes — Flight Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav>
    <a href="index.html" class="brand">✈ Flight Tracker</a>
    <a href="index.html">Search & Monitor</a>
    <a href="routes.html">My Routes</a>
  </nav>

  <div class="container">
    <div id="flash"></div>
    <h1>My Monitored Routes</h1>

    <div class="card" id="lookup-card">
      <h2>Look up your routes</h2>
      <label>Your name or ID</label>
      <input type="text" id="user-id-input" placeholder="e.g. daniel">
      <button onclick="loadRoutes()">View routes</button>
    </div>

    <div id="routes-section" style="display:none;">
      <p id="routes-subtitle" style="margin-bottom:1.2rem; color:#555; font-size:.9rem;"></p>
      <div class="card" style="padding:0; overflow:hidden;">
        <table>
          <thead>
            <tr>
              <th>Route</th>
              <th>Date</th>
              <th>Threshold</th>
              <th>Class</th>
              <th>Contact</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="routes-body"></tbody>
        </table>
      </div>
      <a href="index.html" class="btn" style="margin-top:.5rem;">Monitor another route</a>
    </div>

    <div id="empty-section" style="display:none;">
      <div class="card">
        <p style="color:#666;" id="empty-msg"></p>
        <br>
        <a href="index.html" class="btn">Monitor a route</a>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="routes.js"></script>
</body>
</html>
