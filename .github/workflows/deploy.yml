name: Deploy to AWS Lambda

on:
  push:
    branches: [main]

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPO: flight-tracker-searcher
  STACK_NAME: flight-tracker-gen3

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push flight-searcher image
        run: |
          IMAGE_URI=$ECR_REGISTRY/$ECR_REPO:${{ github.sha }}
          docker build -t $IMAGE_URI lambda/flight_searcher/
          docker push $IMAGE_URI

      - name: Set up SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: SAM build
        run: sam build

      - name: Resolve SQS queue details
        run: |
          PRICE_EVENTS_URL=$(aws sqs get-queue-url \
            --queue-name flight-tracker-price-events \
            --query QueueUrl --output text)
          PRICE_EVENTS_ARN=$(aws sqs get-queue-attributes \
            --queue-url $PRICE_EVENTS_URL \
            --attribute-names QueueArn \
            --query Attributes.QueueArn --output text)
          NOTIF_URL=$(aws sqs get-queue-url \
            --queue-name flight-tracker-notifications \
            --query QueueUrl --output text)
          NOTIF_ARN=$(aws sqs get-queue-attributes \
            --queue-url $NOTIF_URL \
            --attribute-names QueueArn \
            --query Attributes.QueueArn --output text)
          echo "PRICE_EVENTS_URL=$PRICE_EVENTS_URL" >> $GITHUB_ENV
          echo "PRICE_EVENTS_ARN=$PRICE_EVENTS_ARN" >> $GITHUB_ENV
          echo "NOTIF_URL=$NOTIF_URL" >> $GITHUB_ENV
          echo "NOTIF_ARN=$NOTIF_ARN" >> $GITHUB_ENV

      - name: SAM deploy
        run: |
          sam deploy \
            --stack-name $STACK_NAME \
            --region $AWS_REGION \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              SmtpUser=${{ secrets.SMTP_USER }} \
              SmtpPassword=${{ secrets.SMTP_PASSWORD }} \
              SmtpFrom=${{ secrets.SMTP_FROM }} \
              FlaskSecretKey=${{ secrets.FLASK_SECRET_KEY }} \
              FlightSearcherImageUri=$ECR_REGISTRY/$ECR_REPO:${{ github.sha }} \
              PriceEventsQueueUrl=$PRICE_EVENTS_URL \
              PriceEventsQueueArn=$PRICE_EVENTS_ARN \
              NotificationQueueUrl=$NOTIF_URL \
              NotificationQueueArn=$NOTIF_ARN

      - name: Inject API URL into frontend
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name $STACK_NAME \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text)
          sed -i "s|__API_URL__|$API_URL|g" frontend/config.js

      - name: Deploy frontend to S3
        run: aws s3 sync frontend/ s3://${{ secrets.FRONTEND_BUCKET }}/ --delete
